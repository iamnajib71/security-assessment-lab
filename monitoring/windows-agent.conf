<agent_config os="Windows">
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID=4728 or EventID=4732 or EventID=4756 or EventID=4740 or EventID=4625 or EventID=4771 or EventID=4697 or EventID=4698 or EventID=4719 or EventID=5136 or EventID=5145]</query>
  </localfile>
  <localfile>
    <location>System</location><log_format>eventchannel</log_format>
    <query>Event/System[EventID=7045]</query>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location><log_format>eventchannel</log_format>
    <query>Event/System[EventID=1 or EventID=4 or EventID=11 or EventID=16]</query>
  </localfile>
  <active-response><disabled>yes</disabled></active-response>
</agent_config>
