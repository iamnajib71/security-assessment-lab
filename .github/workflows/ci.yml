name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  parsers-and-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_secrets.py
      - run: python scripts/verify_evidence.py
      - run: python scripts/monitoring_evidence.py
      - run: python scripts/report.py --current "$(python -c 'import json; print("evidence/"+json.load(open("report/findings.json"))["current"])')" --output tmp/ci-report
      - uses: actions/upload-artifact@v4
        with:
          name: generated-assessment-report
          path: tmp/ci-report/
